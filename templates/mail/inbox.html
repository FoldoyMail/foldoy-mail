><i style="width:86%"></i></span></div><div class="row skr"><span class="av"></span><span class="r1"><i style="width:48%"></i></span><span class="r2"><i style="width:62%"></i></span><span class="pv"><i style="width:73%"></i></span></div><div class="row skr"><span class="av"></span><span class="r1"><i style="width:30%"></i></span><span class="r2"><i style="width:68%"></i></span><span class="pv"><i style="width:81%"></i></span></div></div></section>

<button class="fab pill light" type="button" data-act="compose" aria-label="Write a message" disabled><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16l1-4 8.5-8.5a2.1 2.1 0 013 3L8 15l-4 1z"/></svg><span>Write</span></button>
<div class="keys" id="keys" role="dialog" aria-modal="true" aria-labelledby="keysh" hidden></div>
<script type="module" src="{% static 'mail/inbox/inbox.js' %}"></script>
